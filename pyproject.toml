[project]
name = "trip-event-crawler"
version = "0.1.0"
description = "Trip.com 各市場促銷活動監控 × LINE 推播 × 搶購日曆提醒（MVP）"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tenacity>=8.3",
    "cryptography>=42.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tripbot"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 交給 formatter 心智；此處仍保留檢查但放寬到 line-length
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["bs4", "bs4.*", "vercel.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# 讓裸 `pytest`（CI）與 `python -m pytest`（本地）行為一致：repo 根目錄進 sys.path
pythonpath = ["."]
